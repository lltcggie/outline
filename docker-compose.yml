services:
  redis:
    image: redis
    ports:
      - "127.0.0.1:6379:6379"
    user: "redis:redis"
  postgres:
    # PostgreSQL with the PGroonga extension, used by the search-pgroonga
    # plugin. Same tag as the CI database, see .github/workflows/ci.yml.
    image: groonga/pgroonga:4.0.9-debian-18
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: outline
    user: "postgres:postgres"
